// Quake VR's shipped settings: the tuned values over the compiled-in defaults.
// Executed by default.cfg (so the saved config still wins); written by "vr_savedefaults".

vr_default vr_mirror "1"
vr_default vr_window_view "1"
vr_default vr_spectator_fov "130"
vr_default vr_spectator_scale "1"
vr_default vr_foveated "3"
vr_default vr_world_scale "1.2"
vr_default vr_menu_level "0"
vr_default vr_walltorch_inv_size "0.15"
vr_default vr_burn_touch "1"
vr_default vr_flashlight_cord "1"
vr_default vr_retrolight_model_steps "15"
vr_default vr_swim_stroke "10"
vr_default vr_swim_max_speed "400"
vr_default vr_knockdown_chance "0.6"
vr_default vr_knockdown_damage "3"
vr_default vr_knockdown_time_min "1.75"
vr_default vr_knockdown_time_max "3.5"
vr_default vr_knockdown_getup_speed "0.8"

// The engine's graphics settings.
vr_default gl_texture_anisotropy "16"
vr_default r_lavaalpha "0.9"
vr_default r_particles "1"
vr_default r_slimealpha "0.6"
vr_default r_softemu_mdl_warp "0"
vr_default r_telealpha "0.9"
vr_default r_wateralpha "0.3"
vr_default r_waterwarp "2"
