// Quake VR default configuration: Ironwail's defaults (Quake/default_cfg.h), with the gamepad
// bindings replaced by the VR controller bindings. "Reset to defaults" in the menu runs this.

unbindall
bind ALT +strafe
bind , +moveleft
bind a +moveleft
bind . +moveright
bind d +moveright
bind DEL +lookdown
bind PGDN +lookup
bind END centerview
bind e +moveup
bind c +movedown
bind SHIFT +speed
bind CTRL +attack
bind UPARROW +forward
bind w +forward
bind DOWNARROW +back
bind s +back
bind LEFTARROW +left
bind RIGHTARROW +right
bind SPACE +jump
bind TAB +showscores
bind 1 "impulse 1"
bind 2 "impulse 2"
bind 3 "impulse 3"
bind 4 "impulse 4"
bind 5 "impulse 5"
bind 6 "impulse 6"
bind 7 "impulse 7"
bind 8 "impulse 8"
bind 0 "impulse 0"
bind / "impulse 10"
bind MWHEELDOWN "impulse 10"
bind MWHEELUP "impulse 12"
alias zoom_in "togglezoom"
alias zoom_out "togglezoom"
bind F11 zoom_in
bind F1 "help"
bind F2 "menu_save"
bind F3 "menu_load"
bind F4 "menu_options"
bind F5 "menu_multiplayer"
bind F6 "echo Quicksaving...; wait; save quick"
bind F9 "echo Quickloading...; wait; load quick"
bind F10 "quit"
bind F12 "screenshot"
bind PRINTSCREEN "screenshot"
bind \ +mlook
bind PAUSE "pause"
bind ESCAPE "togglemenu"
bind ~ "toggleconsole"
bind ` "toggleconsole"
bind t "messagemode"
bind + "sizeup"
bind = "sizeup"
bind - "sizedown"
bind INS +klook
bind MOUSE1 +attack
bind MOUSE2 +offhandattack
// Playing on the desktop (no headset): the VR actions on keys, as the old Quake VR config had.
bind k +grableft
bind l +grabright
bind n +reloadleft
bind m +reloadright
bind o +flickreloadleft
bind i +flickreloadright
bind 7 "impulse 42"
bind 8 "impulse 43"
exec vr_bindings.cfg
// The tuned Quake VR settings over the compiled-in defaults ("vr_savedefaults" rewrites it).
exec vr_defaults.cfg
gamma 0.95
contrast 1.2
vid_fsaa 4
volume 0.7
sensitivity 3
viewsize 110
scr_autoscale
+mlook

