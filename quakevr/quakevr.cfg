// Settings the Quake VR progs require. Executed after the saved config (so these win over
// values saved by other mods) and before autoexec.cfg (so players can still override them).

// Gameplay rules the Quake VR progs are designed around.
vr_gameplayfix_droptofloor 1
vr_gameplayfix_touchsolids 1
vr_gameplayfix_missilesize 2
sv_gameplayfix_random 0
