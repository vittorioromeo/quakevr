# expect.cfg -- what each category of motion take should do, for vr_motion_eval (docs/vr-port/MOTIONS.md).
#
# One line per category (or per label: slash_overhead, which wins over its category), then its items:
#   kind[/sub][@point|point...]   an event that must happen (any one of the listed ones will do), from the
#                                 take's start to its end (not in its lead-in); a hit must be on the target.
#                                 Kinds: melee (sub: punch slap overhead_blow uppercut backhand swing thrust
#                                 rising_swing stab), bash, parrybash, shove (sub: main off both), headbutt,
#                                 stroke, push (sub: bash shove), parry, deflect. Points: the striking point's
#                                 name with underscores (the_tip, mid-blade, the_blade, the_pommel, the_hilt,
#                                 the_guard, the_hand, the_handle, the_head, the_knuckles, the_fist, ...).
#   !kind[/sub]                   an event that must not happen.
#   none                          no melee event at all: no hit (melee, bash, parrybash, shove, headbutt), no
#                                 stroke, push or batting.
#   pose:parry | pose:guard       the parry test (a monster's blow from the target would be parried) or the
#                                 bash's guard holds for at least half of the take (its frames in phase rec).
#                                 The parry test is the take's m_parry, o_parry or parry_arms (QC VR_Parry_Blocks
#                                 towards the target, or crossed empty arms); the guard is guard >= 0 (QC
#                                 VR_Bash_Guard), both as the replay computes them each server frame.
#   !pose:parry | !pose:guard     likewise, never: not one frame of the take (phase rec) in it.
#   weapon:a|b                    the category means something only with these weapons in hand (fist, axe,
#                                 mjolnir, sword, gun, grapple): with another the take is N/A (reported apart).
#   -                             no verdict: the take is reported only.
# Any hit whose kind is not among the required ones fails the take (a slash that also bashes is wrong).

slash           melee                                                   weapon:sword|axe|mjolnir
stab            melee/stab                                              weapon:sword
no_hit          none
bash            bash parrybash
parry_pose      pose:parry !stroke !push
not_parry_pose  none !pose:parry !pose:guard
parry_bash      bash parrybash
hilt_pommel     melee@the_pommel|the_hilt|the_guard|the_hand|the_handle weapon:sword|axe|mjolnir
punch           melee                                                   weapon:fist
palm_shove_1h   shove/main shove/off                                    weapon:fist
palm_shove_2h   shove/both                                              weapon:fist
gun_strike      melee                                                   weapon:gun
other           -
