// Quake VR controller bindings, run by default.cfg and -- once per bindings version -- by
// "vr_checkbindings" in quakevr.cfg, so that a config saved without them (the first run, a
// config inherited from id1, an older Quake VR) gets them without losing later rebinds.
//
// VR controllers (Quake/vr/vr_input.cpp): gamepad keys by role -- main hand RT/RB/A/B/RS,
// off hand LT/LB/X/Y/LS, main stick up/down DPAD_UP/DPAD_DOWN. The menu button is Escape.
bind RTRIGGER +attack
bind LTRIGGER +offhandattack
bind RSHOULDER +grabmain
bind LSHOULDER +graboff
bind ABUTTON +jump
bind BBUTTON "impulse 10"
bind YBUTTON "impulse 12"
bind XBUTTON +reloadoff
bind RTHUMB +reloadmain
bind LTHUMB +speed
bind DPAD_UP +moveup
bind DPAD_DOWN +movedown
