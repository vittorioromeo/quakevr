// Quake VR controller bindings and display defaults, run by default.cfg and -- once per bindings version -- by
// "vr_checkbindings" in quakevr.cfg, so that a config saved without them (the first run, a
// config inherited from id1, an older Quake VR) gets them without losing later rebinds.
//
// VR controllers (Quake/vr/vr_input.cpp): gamepad keys by role -- main hand RT/RB/A/B/RS,
// off hand LT/LB/X/Y/LS, main stick up/down DPAD_UP/DPAD_DOWN. The menu button is Escape.
bind RTRIGGER +attack
bind LTRIGGER +offhandattack
bind RSHOULDER +grabmain
bind LSHOULDER +graboff
bind ABUTTON +jump
bind BBUTTON "impulse 10"
bind YBUTTON "impulse 12"
bind XBUTTON +reloadoff
bind RTHUMB +reloadmain
bind LTHUMB +speed
bind DPAD_UP +moveup
bind DPAD_DOWN +movedown

// VR display defaults (bindings version 2): the classic status bar, which is shown on a hand.
hudstyle 0
viewsize 100

// The weapon aim relative to the controller (vr_gunangle, vr_gunyaw, vr_offhandpitch, vr_offhandyaw) was set here
// (bindings version 3). It is part of the hand calibration now, shipped in vr_defaults.cfg with the weapon offsets set
// over it: run again after a first start's config, these lines put back the old aim under the new offsets.
