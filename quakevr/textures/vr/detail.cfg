# detail.cfg -- which detail texture the world's textures get (vr_detail.cpp; docs/vr-port/ROUND17.md, "Detail
# textures"). A detail texture is a fine grain multiplied over a texture close to the eye, round mid-grey (the
# average brightness is unchanged): the colour times 1 + strength x (2 x detail - 1), full within a third of
# vr_detail_distance, gone at it. The images are textures/vr/detail_<kind>.png (Misc/quakevr/make_detail.py).
#
# --- Kinds --------------------------------------------------------------------------------------------------------
#
#   kind <name> [size=<units>] [strength=<x>] [grain=1]
#
#   name      its image is textures/vr/detail_<name>.png (square, a power of two, all the same size)
#   size      world units one tile of the image covers, at the texture's own scale (a texture drawn twice as big
#             gets a grain twice as big)
#   strength  how strongly it shows (vr_detail_strength scales every kind)
#   grain=1   the image has a grain along its x (wood, brushed metal): turned to run along each texture's own
#             grain, the way its pixels' brightness changes least (a rule's grain=s or grain=t decides instead)
#
# The kinds are the layers of one texture array, in this order (at most 16). Without kind lines, these six.
#
# --- Rules --------------------------------------------------------------------------------------------------------
#
#   <[map/]pattern> [kind=<name>|none|auto] [scale=<x>] [strength=<x>] [grain=s|t|auto]
#
#   pattern   a texture name with * and ? wildcards; case does not matter. An animated texture's +0, +1, +a...
#             is matched with and without it (butn* matches +0butn). With a map in front (e1m1/wood*, also with
#             wildcards) only on that map; the ammo and health boxes' textures count as the map's.
#   kind      none: no detail; auto: judged by its colours (below)
#   scale     times the kind's size (2: a grain twice as big)
#   strength  times the kind's strength
#   grain     s or t: which way the grain runs (grain kinds); auto: the texture's own way
#
# Every rule that matches applies, in order; a later one's settings win over an earlier one's. A texture that no
# rule gives a kind is judged by its colours: mostly glowing (fullbright pixels): none; grey: metal if bluish or
# smooth, stone if busy; green, or strongly red: organic; a strong grain one way: wood; very dark: dirt; else
# stone. Quake's palette is mostly brown, so that is a rough guess: the rules below name id's, hipnotic's and
# rogue's textures. Sky, water, slime, lava and teleports never get any.
#
# `vr_detail_list [pattern]` lists the map's textures, the kind each gets and why (cfg or auto), their tile and
# strength. The file is read again at each map (a change shows at the next map or `map` restart);
# `vr_detail_reload` reads it and the images again at once.

kind stone    size=64 strength=0.8
kind metal    size=48 strength=0.6  grain=1
kind wood     size=64 strength=0.8  grain=1
kind dirt     size=48 strength=0.75
kind organic  size=48 strength=0.75
kind plaster  size=32 strength=0.6

