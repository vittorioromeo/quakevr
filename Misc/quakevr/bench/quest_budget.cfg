// quest_budget.cfg -- Quest-like graphics for a PC budget run (docs/vr-port/QUEST_PLAN.md, "Perf budget"; C6 tunes
// the real Quest defaults from it). Use with the Quest 3's 72 Hz and about its default eye size:
//   bash qvr-kit/bench.sh <agent> --settings <tree>/Misc/quakevr/bench/quest_budget.cfg --hz 72 --eye 1760
// and QVR_GLES_COMPAT=1 in front for the renderer kept to OpenGL ES 3.2's features (-glescompat).
// A PC GPU's numbers: the relative cost of each setting, not the Quest's frame time.
vr_graphics_preset 1 // Low
vid_fsaa 0           // no MSAA in the scene target (the Quest's tiler resolves MSAA cheaply; C6 measures 2x/4x there)
vr_render_scale 1
vr_dynres 0
