// The test baseline config (docs/vr-port/TESTING.md, "The test baseline config"). An agent's worktree has it as
// quakevr/ironwail.cfg.baseline; the kit's run.ps1 puts that back as quakevr/ironwail.cfg after every run (a lane
// copies it before each). Tests start from the shipped defaults: only what a test run needs to differ from them is
// here, each line with why. No vr_wofs_*, vr_prop_*, calibration or other personal settings, so weapons.txt, the
// props' and the compiled defaults reach every run. The window, the mock headset, fast mode and the log are the kit's
// command line and autoexec (run.ps1), not settings here.

// A sparse config (vr_cvars.cpp, vr_cfg_version 218 and later): every Quake VR setting at its shipped default before
// the lines below, as a game's own saved config starts.
vr_config_defaults
// The changed defaults this config has taken: the current build's (vr_cvars.cpp configVersion), so it is read as a
// saved config of this version, not reset as an old one ("older than 1.0.1"). A newer build moves it on; its
// migrations only touch settings still at an old default (here every one, so they stay at the shipped defaults).
vr_cfg_version "224"
// The same for the weapons' settings (vr_weapons.cpp settingsVersion), the held objects' (vr_props.cpp
// settingsVersion) and the bindings' (vr_bindings.cfg): a missing marker reads as a config from before all of them.
vr_wofs_version "79"
vr_props_version "68"
vr_bindings_version "3"
// Not a first start: vr_startgame goes to the hub, not the tutorial (vrtutorial), as for any player with a config.
vr_tutorial_started "1"
