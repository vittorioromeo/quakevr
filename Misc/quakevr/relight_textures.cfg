# relight_textures.cfg -- which textures of the relit maps give off light, and how much
# (Misc/quakevr/relight_maps.py reads it; another file: --textures <file>).
#
# One rule a line: a texture pattern, then settings.
#
#   <pattern> [kind=fixture|glow|off] [scale=<x>] [light=<n>] [color=<r>,<g>,<b>] [reach=<x>]
#
# The pattern is a texture name, as `--list-glows` prints it, with * and ? wildcards, optionally with the
# map (e1m1/tlight11) or the game and map (hipnotic/*/tlight02) in front. Every rule that matches applies,
# in order; a later one's settings win over an earlier one's.
#
#   kind    fixture: a light fixture (lamp, light panel, strip light): a light of its own (one every
#                    128 units of a big one), 250 for a lone fixture (--fixture-scale), half of it by a
#                    mapper's light of 300 that is on from the start (--fixture-lit), less for a small
#                    or faint fixture and in a room of many.
#           glow:    a glowing texture (button, computer panel, rune, slipgate): a share of the room's
#                    glow budget (--glow-budget), so that many glowing things do not flood a room.
#           off:     gives off no light.
#           Without a rule, textures named *light* or *lamp* are fixtures, other glowing ones glow.
#   scale   times the texture's light (1: as computed).
#   light   a fixture's light instead of 250 (before the reductions above and the scales).
#   color   the light's colour instead of the glowing pixels' mean (0-255 each).
#   reach   how far the light reaches (1: as computed; 2: twice as far).
#
# What glows: a texture's fullbright pixels (palette 224-254) or, where it has too few, the glowing part
# of a replacement texture's luma image (QRP's textures/<name>_luma.tga; --no-luma ignores those). A
# texture named a fixture here with nothing glowing gets the colour of its brightest pixels.
#
# After a change, rerun relight_maps.py (the maps whose lights changed are relit; about 4 s a map) and
# restart the map. `relight_maps.py --quake <Quake> --list-glows --only e1m1` lists a map's glowing
# textures, their kind and their lights without relighting.

# --- id1: light fixtures ---------------------------------------------------------------------------
tlight01    kind=fixture                # round lamp in a dark plate (little of it glows)
tlight01_2  kind=fixture
tlight02    kind=fixture                # four yellow squares in a panel (ceilings, walls)
tlight03    kind=fixture                # blue panel light
tlight05    kind=fixture                # blue tube (no fullbright pixels: glows with QRP's luma)
tlight06    kind=fixture                # blue tube on rust
tlight07    kind=fixture                # yellow tube with a red dot
tlight08    kind=off                    # plain metal trim of the light textures: nothing glows
tlight09    kind=fixture                # yellow tube (no fullbright pixels: glows with QRP's luma)
tlight10    kind=fixture                # yellow squares (no fullbright pixels: glows with QRP's luma)
tlight11    kind=fixture                # the white lanterns on e1m1's pillars
light1_*    kind=fixture                # round lamps and blue bars (no fullbright pixels: glow with QRP's luma)
light1_4    scale=2                     # big blue bar panels set in ceiling coffers (e1m6): the coffer keeps much
                                        # of their light in, and the halls' own lights start off
light3_*    kind=fixture
ceil1_1     kind=fixture scale=2        # small blue lamps, often in a column (e2m1): many in a room, so more each
sfloor4_4   kind=fixture scale=0.6      # lit glass floor tiles: big, so less each

# --- id1: glowing, not fixtures -------------------------------------------------------------------
sliplite    kind=glow                   # the slipgates' red rims
metal5_8    kind=glow                   # yellow arrows (dm4)
tech03_2    kind=glow                   # thin blue strips along tech walls

# --- hipnotic (Scourge of Armagon) ----------------------------------------------------------------
hipnotic/*/light3_1  kind=fixture

# --- rogue (Dissolution of Eternity) --------------------------------------------------------------
rogue/*/metal8_3     kind=fixture       # hazard plate with a blue lamp
rogue/*/metal9_2     kind=fixture       # blue wall lamps

# --- per map --------------------------------------------------------------------------------------
# e1m1/tlight11 scale=1.5              # (example) e1m1's lanterns brighter still
