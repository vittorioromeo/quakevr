// Quake VR's game configuration for TrenchBroom (2026.2; game config version 9).
// Based on TrenchBroom's own Quake configuration. Installed by Misc/trenchbroom/install.ps1 into
// %APPDATA%\TrenchBroom\games\QuakeVR; see docs/vr-port/MAPPING.md.
//
// The game path is the Quake folder (with id1, hipnotic, rogue and quakevr). New maps start with the mods
// hipnotic, rogue and quakevr (initial_*.map: "_tb_mod"), as the engine layers them, so that Quake VR's and the
// mission packs' models show; and with the Quake VR texture WAD (quakevr/wads/quakevr_dev.wad).
{
    "version": 9,
    "name": "Quake VR",
    "icon": "Icon.png",
    "fileformats": [
        { "format": "Valve", "initialmap": "initial_valve.map" },
        { "format": "Standard", "initialmap": "initial_standard.map" }
    ],
    "filesystem": {
        "searchpath": "id1",
        "packageformat": { "extension": ".pak", "format": "idpak" }
    },
    "materials": {
        "root": "textures",
        "extensions": [".D"],
        "palette": "gfx/palette.lmp",
        "attribute": "wad"
    },
    "entities": {
        "definitions": [ "quakevr.fgd" ],
        "defaultcolor": "0.6 0.6 0.6 1.0"
    },
    "tags": {
        "brush": [
            {
                "name": "Detail",
                "attribs": [],
                "match": "classname",
                "pattern": "func_detail*"
            },
            {
                "name": "Trigger",
                "attribs": [ "transparent" ],
                "match": "classname",
                "pattern": "trigger*",
                "material": "trigger" // set this material when tag is enabled
            },
            {
                "name": "Func",
                "attribs": [],
                "match": "classname",
                "pattern": "func*"
            }
        ],
        "brushface": [
            {
                "name": "Clip",
                "attribs": [ "transparent" ],
                "match": "material",
                "pattern": "clip"
            },
            {
                "name": "Skip",
                "match": "material",
                "pattern": "skip"
            },
            {
                "name": "Hint",
                "attribs": [ "transparent" ],
                "match": "material",
                "pattern": "hint*"
            },
            {
                "name": "Liquid",
                "attribs": [ "transparent" ],
                "match": "material",
                "pattern": "\**"
            }
        ]
    },
    "softMapBounds":"-4096 -4096 -4096 4096 4096 4096",
    "compilationTools": [
        { "name": "qbsp", "description": "ericw-tools 2.0 qbsp.exe" },
        { "name": "vis", "description": "ericw-tools 2.0 vis.exe" },
        { "name": "light", "description": "ericw-tools 2.0 light.exe" }
    ]
}
