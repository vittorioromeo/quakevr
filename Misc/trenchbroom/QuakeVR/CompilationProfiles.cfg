{
    "profiles": [
        {
            "name": "Quake VR: full (ericw-tools 2.0)",
            "tasks": [
                {
                    "enabled": true,
                    "stripTbProperties": true,
                    "target": "${WORK_DIR_PATH}/${MAP_BASE_NAME}-compile.map",
                    "type": "export"
                },
                {
                    "enabled": true,
                    "parameters": "-nolog -nopercent -wadpath \"${GAME_DIR_PATH}\" ${MAP_BASE_NAME}-compile.map ${MAP_BASE_NAME}.bsp",
                    "tool": "${qbsp}",
                    "treatNonZeroResultCodeAsError": true,
                    "type": "tool"
                },
                {
                    "enabled": true,
                    "parameters": "-nolog -nopercent ${MAP_BASE_NAME}.bsp",
                    "tool": "${vis}",
                    "treatNonZeroResultCodeAsError": true,
                    "type": "tool"
                },
                {
                    "enabled": true,
                    "parameters": "-nolog -nopercent -extra4 -dirt -dirtscale 1.5 -dirtdepth 96 -lit -lux -lightgrid -lightgrid_dist 64 64 64 ${MAP_BASE_NAME}.bsp",
                    "tool": "${light}",
                    "treatNonZeroResultCodeAsError": true,
                    "type": "tool"
                },
                {
                    "enabled": true,
                    "target": "${MAP_BASE_NAME}-compile.map",
                    "type": "delete"
                },
                {
                    "enabled": true,
                    "target": "${MAP_BASE_NAME}.prt",
                    "type": "delete"
                },
                {
                    "enabled": true,
                    "target": "${MAP_BASE_NAME}.*.json",
                    "type": "delete"
                }
            ],
            "workdir": "${GAME_DIR_PATH}/${MODS[-1]}/maps"
        },
        {
            "name": "Quake VR: fast (no vis, quick light)",
            "tasks": [
                {
                    "enabled": true,
                    "stripTbProperties": true,
                    "target": "${WORK_DIR_PATH}/${MAP_BASE_NAME}-compile.map",
                    "type": "export"
                },
                {
                    "enabled": true,
                    "parameters": "-nolog -nopercent -wadpath \"${GAME_DIR_PATH}\" ${MAP_BASE_NAME}-compile.map ${MAP_BASE_NAME}.bsp",
                    "tool": "${qbsp}",
                    "treatNonZeroResultCodeAsError": true,
                    "type": "tool"
                },
                {
                    "enabled": true,
                    "parameters": "-nolog -nopercent -lit -lux ${MAP_BASE_NAME}.bsp",
                    "tool": "${light}",
                    "treatNonZeroResultCodeAsError": true,
                    "type": "tool"
                },
                {
                    "enabled": true,
                    "target": "${MAP_BASE_NAME}-compile.map",
                    "type": "delete"
                },
                {
                    "enabled": true,
                    "target": "${MAP_BASE_NAME}.prt",
                    "type": "delete"
                },
                {
                    "enabled": true,
                    "target": "${MAP_BASE_NAME}.*.json",
                    "type": "delete"
                }
            ],
            "workdir": "${GAME_DIR_PATH}/${MODS[-1]}/maps"
        }
    ],
    "version": 1
}
